<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Data Siswa</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.container{
    width:700px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

table,th,td{
    border:1px solid #000;
}

th{
    background:#007bff;
    color:white;
}

th,td{
    padding:10px;
    text-align:center;
}

button{
    padding:8px 15px;
}
</style>

</head>

<body>

<div class="container">

<h2>Data Siswa</h2>

<input type="text" placeholder="Cari Nama">

<table>

<tr>
<th>ID</th>
<th>Nama</th>
<th>Kelas</th>
<th>Aksi</th>
</tr>

<tr>
<td>1</td>
<td>Andi</td>
<td>X RPL</td>
<td>
<button>Edit</button>
<button>Hapus</button>
</td>
</tr>

<tr>
<td>2</td>
<td>Sinta</td>
<td>X TKJ</td>
<td>
<button>Edit</button>
<button>Hapus</button>
</td>
</tr>

</table>

</div>

</body>
</html>
